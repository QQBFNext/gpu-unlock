name: Build .deb Packages

on:
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Можно добавить другие версии Ubuntu для совместимости
        os: [ubuntu-26.04]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        # Устанавливаем всё необходимое для сборки deb-пакета и модуля ядра
        sudo apt-get install -y \
          build-essential \
          devscripts \
          debhelper \
          dpkg-dev \
          dkms \
          fakeroot \
          git \
          linux-headers-generic \
          zstd \
          python3

    - name: Build .deb packages
      run: |
        # Официальная цель Makefile для сборки пакетов
        # (не устанавливает их, а только собирает в build/deb)
        make deb

    - name: List built packages (for debugging)
      run: ls -la build/deb/ || echo "Directory build/deb not found"

    - name: Upload .deb artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gpu-unlock-deb-${{ matrix.os }}
        path: build/deb/*.deb
        if-no-files-found: error # Упадёт, если пакеты не собрались
